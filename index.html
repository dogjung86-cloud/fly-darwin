<html>
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Fly Darwin | Fly In To The Evolution</title>
		<meta name="description" content="Demo of the game: The Making of 'The Aviator': Animating a Basic 3D Scene with Three.js" />
		<meta name="keywords" content="three.js, webgl, tutorial, game, 3d, animation, airplane, web development, javascript" />
		<meta name="author" content="Karim Maaloul for Codrops" />
		<link rel="shortcut icon" href="favicon.ico">
		<link href='https://fonts.googleapis.com/css?family=Playfair+Display:400,700,700italic' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" type="text/css" href="css/demo.css" />
		<link rel="stylesheet" type="text/css" href="css/game.css?v=6" />
		<script type="text/javascript" src="js/TweenMax.min.js"></script>
		<script type="text/javascript" src="js/three.min.js"></script>
		<script type="text/javascript" src="js/characters.js?v=4"></script>
		<script type="text/javascript" src="js/game.js?v=4"></script>
		<!--[if IE]>
		  <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
		<![endif]-->
	</head>
	<body>
		<div class="game-holder" id="gameHolder">
			<div class="header">
				<h1>Fly Darwin</h1>
				<h2>fly in to the evolution</h2>
				<div class="score" id="score">
					<div class="score__content" id="level">
						<div class="score__label">level</div>
						<div class="score__value score__value--level" id="levelValue">1</div>
						<svg class="level-circle" id="levelCircle" viewbox="0 0 200 200">
							<circle id="levelCircleBgr" r="80" cx="100" cy="100" fill="none" stroke="#4A7A9B" stroke-width="24px" />
							<circle id="levelCircleStroke" r="80" cx="100" cy="100" fill="none" stroke="#D4762C" stroke-width="14px" stroke-dasharray="502" />
						</svg>
					</div>
					<div class="score__content" id="dist">
						<div class="score__label">distance</div>
						<div class="score__value score__value--dist" id="distValue">000</div>
					</div>
					<div class="score__content" id="energy">
						<div class="score__label">energy</div>
						<div class="score__value score__value--energy" id="energyValue">
							<div class="energy-bar" id="energyBar"></div>
						</div>
					</div>
				</div>
			</div>
			<div class="world" id="world"></div>
		<!-- Game Over Overlay -->
		<div id="gameOverOverlay" class="gameover-overlay">
			<div class="gameover-panel">
				<!-- Phase 1: Score Display + Name Input -->
				<div id="gameOverScore" class="gameover-section">
					<h2 class="gameover-title">GAME OVER</h2>
					<div class="gameover-stats">
						<div class="gameover-stat">
							<span class="gameover-stat-label">최종 거리</span>
							<span class="gameover-stat-value" id="finalDistance">0</span>
						</div>
						<div class="gameover-stat">
							<span class="gameover-stat-label">레벨</span>
							<span class="gameover-stat-value" id="finalLevel">1</span>
						</div>
						<div class="gameover-stat">
							<span class="gameover-stat-label">진화 형태</span>
							<span class="gameover-stat-value gameover-stat-form" id="finalForm">Amoeba</span>
						</div>
					</div>
					<div class="gameover-input-group">
						<input type="text" id="playerNameInput" class="gameover-input" maxlength="20" placeholder="닉네임 입력 (최대 20자)" autocomplete="off" />
						<button id="submitScoreBtn" class="gameover-btn gameover-btn--submit">등록</button>
					</div>
					<button id="skipRankBtn" class="gameover-btn gameover-btn--skip">건너뛰고 다시 플레이</button>
				</div>

				<!-- Phase 2: Ranking Board -->
				<div id="rankingBoard" class="gameover-section" style="display:none;">
					<h2 class="gameover-title">🏆 랭킹</h2>
					<div class="ranking-table-wrap">
						<table class="ranking-table">
							<thead>
								<tr>
									<th>순위</th>
									<th>닉네임</th>
									<th>거리</th>
									<th>레벨</th>
									<th>형태</th>
								</tr>
							</thead>
							<tbody id="rankingBody"></tbody>
						</table>
					</div>
					<button id="replayFromRankBtn" class="gameover-btn gameover-btn--replay">다시 플레이</button>
				</div>
			</div>
		</div>

	</div>

		<!-- Mobile Pause Button -->
		<button id="mobilePauseBtn" class="mobile-pause-btn" onclick="if(typeof togglePause==='function'&&game&&game.status==='playing')togglePause();">⏸</button>

		<div id="pauseOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; flex-direction:column; cursor:pointer;" onclick="if(typeof togglePause==='function')togglePause();">
			<div style="color:#fff; font-family:'Playfair Display',serif; font-size:72px; font-weight:700; text-shadow:2px 2px 10px rgba(0,0,0,0.5);">PAUSED</div>
			<div style="color:#d8d0d1; font-family:'Playfair Display',serif; font-size:20px; margin-top:20px;">화면을 터치하거나 ESC/P를 눌러 재개</div>
		</div>
	</body>
</html>
