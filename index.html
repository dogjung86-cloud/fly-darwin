<html>
	<head>
		<script>
			if (window.self === window.top) {
				window.location.href = 'https://www.finch.co.kr';
			}
		</script>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
		<meta http-equiv="Pragma" content="no-cache">
		<meta http-equiv="Expires" content="0">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Fly Darwin | Fly In To The Evolution</title>
		<meta name="description" content="Demo of the game: The Making of 'The Aviator': Animating a Basic 3D Scene with Three.js" />
		<meta name="keywords" content="three.js, webgl, tutorial, game, 3d, animation, airplane, web development, javascript" />
		<meta name="author" content="Karim Maaloul for Codrops" />
		<link rel="shortcut icon" href="favicon.ico">
		<link href='https://fonts.googleapis.com/css?family=Playfair+Display:400,700,700italic' rel='stylesheet' type='text/css'>
		<link rel="stylesheet" type="text/css" href="css/demo.css" />
		<link rel="stylesheet" type="text/css" href="css/game.css?v=6" />
		<script type="text/javascript" src="js/TweenMax.min.js"></script>
		<script type="text/javascript" src="js/three.min.js"></script>
		<script type="text/javascript" src="js/characters.js?v=4"></script>
		<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
		<script type="text/javascript" src="js/game.js?v=4"></script>
		<!--[if IE]>
		  <script src="http://html5shiv.googlecode.com/svn/trunk/html5.js"></script>
		<![endif]-->
	</head>
	<body>
		<div class="game-holder" id="gameHolder">
			<div class="header"><div class="header__title-wrap"><h1>Fly Darwin</h1>
				<h2>fly in to the evolution</h2></div><div class="score" id="score">
					<div class="score__content" id="level">
						<div class="score__label">level</div>
						<div class="score__value score__value--level" id="levelValue">1</div>
						<svg class="level-circle" id="levelCircle" viewbox="0 0 200 200">
							<circle id="levelCircleBgr" r="80" cx="100" cy="100" fill="none" stroke="#4A7A9B" stroke-width="24px" />
							<circle id="levelCircleStroke" r="80" cx="100" cy="100" fill="none" stroke="#D4762C" stroke-width="14px" stroke-dasharray="502" />
						</svg>
					</div>
					<div class="score__content score__content--bordered" id="dist">
						<div class="score__label">distance</div>
						<div class="score__value score__value--dist" id="distValue">000</div><div class="score__unit">m</div>
					</div>
					<div class="score__content score__content--bordered" id="coins"><div class="score__label">coins</div><div class="score__value score__value--dist" id="coinsValue">0</div></div><div class="score__content" id="energy">
<div class="score__label">life</div>
<div class="score__value score__value--hearts" id="heartsValue">
<span class="heart active" id="heart1">&#x2764;&#xFE0F;</span>
<span class="heart active" id="heart2">&#x2764;&#xFE0F;</span>
<span class="heart active" id="heart3">&#x2764;&#xFE0F;</span>
<span class="heart" id="heart4">&#x1F5A4;</span>
<span class="heart" id="heart5">&#x1F5A4;</span>
</div>
</div>
				</div>
			</div>
			<div class="world" id="world"></div>
<!-- Level업 텍스트 -->
<div id="levelUpText" class="level-up-text"></div>
		<!-- Game Over Overlay -->
		<div id="gameOverOverlay" class="gameover-overlay">
			<div class="gameover-panel">
				<!-- Phase 1: Score Display + Name Input -->
				<div id="gameOverScore" class="gameover-section">
					<h2 class="gameover-title">GAME OVER</h2>
					<div class="gameover-stats">
						<div class="gameover-stat">
							<span class="gameover-stat-label">Distance</span>
							<span class="gameover-stat-value" id="finalDistance">0</span>
						</div>
						<div class="gameover-stat">
							<span class="gameover-stat-label">Level</span>
							<span class="gameover-stat-value" id="finalLevel">1</span>
						</div>
						<div class="gameover-stat">
							<span class="gameover-stat-label">Final Form</span>
							<span class="gameover-stat-value gameover-stat-form" id="finalForm">Amoeba</span>
						</div>
<div class="gameover-stat">
<span class="gameover-stat-label">Coins</span>
<span class="gameover-stat-value" id="finalCoins" style="color:#FFD700;">0</span>
</div>
</div>

					</div>
					<div class="gameover-input-group">
						<input type="text" id="playerNameInput" class="gameover-input" maxlength="20" placeholder="User Name (Max 20)" autocomplete="off" />
						<button id="submitScoreBtn" class="gameover-btn gameover-btn--submit">Submit</button>
					</div>
					<button id="skipRankBtn" class="gameover-btn gameover-btn--skip">SKIP and Replay</button> <button class="gameover-btn gameover-btn--ranking" onclick="showRankingFromGameOver()">Ranking</button>
				</div>

				<!-- Phase 2: Ranking Board -->
				<div id="rankingBoard" class="gameover-section" style="display:none;">
					<h2 class="gameover-title">🏆 Ranking</h2>
					<div class="ranking-table-wrap">
						<table class="ranking-table">
							<thead>
								<tr>
									<th>순위</th>
									<th>닉네임</th>
									<th>거리</th>
									<th>Level</th>
									<th>형태</th>
								</tr>
							</thead>
							<tbody id="rankingBody"></tbody>
						</table>
					</div>
					<button id="replayFromRankBtn" class="gameover-btn gameover-btn--replay">Replay</button>
				</div>
			</div>
		</div>

	</div>

		<!-- Mobile Pause Button -->
		<button id="mobilePauseBtn" class="mobile-pause-btn">⏸</button>

		<div id="pauseOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; flex-direction:column; cursor:pointer;">
			<div style="color:#fff; font-family:'Playfair Display',serif; font-size:72px; font-weight:700; text-shadow:2px 2px 10px rgba(0,0,0,0.5);">PAUSED</div>
			<div style="color:#d8d0d1; font-family:'Playfair Display',serif; font-size:20px; margin-top:20px;">화면을 터치하거나 ESC/P를 눌러 재개</div>
		</div>

		<div style="position:fixed; bottom:10px; right:15px; font-size:11px; color:rgba(255,255,255,0.4); z-index:100; font-family:'Playfair Display',serif; pointer-events:none;">Inspired by TheAviator (Codrops)</div>
	</body>
</html>
